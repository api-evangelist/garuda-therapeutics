aid: garuda-therapeutics
name: Garuda Therapeutics
description: 'Garuda Therapeutics was a clinical-stage biotechnology company founded in 2021 by
  Sean Morrison and David Scadden and headquartered in Massachusetts (Cambridge, later Natick),
  developing off-the-shelf, self-renewing, HLA-compatible, transgene-free hematopoietic (blood)
  stem cell therapies intended to remove the dependency on a matched donor or on patient cells in
  the treatment of hematologic malignancies, sickle cell disease, beta-thalassemia and bone marrow
  failure. It raised roughly $184M across a $72M Series A and a $50M Series A-1 closed in March
  2025, backed by OrbiMed Advisors, Northpond Ventures, Cormorant Asset Management and Kyowa Kirin.
  It is a therapeutics developer, not a software company: it never published an API, SDK, developer
  portal or machine-readable specification, and its website garudatx.com no longer serves company
  content and now resolves to a GoDaddy parking lander.'
